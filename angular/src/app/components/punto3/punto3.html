<div class="container mt-4">

    <h2 class="text-center mb-4">
        Juego de Memoria
    </h2>
    <div class="text-center mb-3">
        <button
            class="btn btn-success me-2"
            (click)="iniciarJuego()">
            INICIAR
        </button>
        <button
            class="btn btn-danger"
            (click)="reiniciarJuego()">
            REINICIAR
        </button>
    </div>

    <h4 class="text-center">
        Intentos: {{ intentos }}
    </h4>

    <div class="row justify-content-center mt-4">
        <div
            class="col-3 col-md-2 mb-3"
            *ngFor="let carta of cartas">
            <div
                class="card carta"
                (click)="seleccionarCarta(carta)">
                <img
                    class="img-fluid"
                    [src]="carta.descubierta || carta.encontrada
                    ? carta.img
                    : 'cartas/tapada.png'">
            </div>
        </div>
    </div>
</div>
